name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build first: the smoke script runs against the compiled lib/.
      - name: Build
        run: npm run build

      - name: Smoke
        run: npm run smoke

      - name: Unit tests
        run: npm test

      - name: Package contents
        run: npm pack --dry-run
